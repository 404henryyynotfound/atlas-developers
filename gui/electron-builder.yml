appId: com.atlasfinancial.developers
productName: Atlas Developers
copyright: Copyright © Atlas Financial
directories:
  output: dist
  buildResources: assets
files:
  - main.js
  - preload.js
  - assets/**/*
  - web-build/**/*
artifactName: atlas-gui-${os}-${arch}.${ext}
publish: never
linux:
  category: Development
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
    - target: tar.gz
      arch:
        - x64
        - arm64
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
win:
  target:
    - target: nsis
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
