appId: com.atlasfinancial.developers
productName: Atlas Developers
copyright: Copyright © Atlas Financial
directories:
  output: dist
  buildResources: assets
files:
  - main.js
  - preload.js
  - assets/**/*
  - web-build/**/*
artifactName: atlas-gui-${os}-${arch}.${ext}
# Targets intentionally omit per-target arch lists: each release matrix job
# passes a single --x64/--arm64 flag, which would otherwise be ignored. The
# macOS .pkg is built separately by packaging/build-pkg-gui.sh because
# electron-builder writes all pkg arch variants to one fixed filename and
# races when multiple arch builds run at once.
linux:
  category: Development
  maintainer: Atlas Financial <support@atlas-developers.surge.sh>
  target:
    - AppImage
    - deb
    - tar.gz
mac:
  category: public.app-category.developer-tools
  identity: null
  target:
    - dmg
    - zip
win:
  target:
    - nsis
    - zip
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
