name: atlas-developers
base: core22
version: '1.0.4'
summary: Local-first tools for the work behind the money
description: |
  Atlas Developers is a local-first CLI and desktop dashboard from Atlas
  Financial for tracking client payments, invoices, projects, subscriptions,
  payouts, billable time and goals. Records stay on your machine, Atlas AI
  works offline by default, and there is no OAuth or embedded credential.
icon: snap/local/desktop/icon.png
grade: stable
confinement: strict
architectures:
  - build-on: amd64
    build-for: amd64
  - build-on: arm64
    build-for: arm64

apps:
  atlas-developers:
    command: bin/gui-launch
    desktop: usr/share/applications/atlas-developers.desktop
    plugs:
      - desktop
      - desktop-legacy
      - home
      - removable-media
      - network
      - network-bind
      - opengl
      - wayland
      - x11
      - pulseaudio
      - browser-support

  atlas:
    command: bin/atlas
    plugs:
      - home
      - network
      - network-bind
      - removable-media

parts:
  gui:
    plugin: nil
    build-packages:
      - curl
      - ca-certificates
    stage-packages:
      - libgtk-3-0
      - libnotify4
      - libnss3
      - libgbm1
      - libasound2
      - libxss1
      - libxkbcommon0
      - libxrandr2
      - libxdamage1
      - libxfixes3
      - libxcomposite1
      - libatk1.0-0
      - libatk-bridge2.0-0
      - libcups2
      - libdrm2
      - libpango-1.0-0
      - libcairo2
      - fonts-liberation
    override-build: |
      set -e
      version="${CRAFT_PROJECT_VERSION:-${SNAPCRAFT_PROJECT_VERSION:-1.0.4}}"
      case "$CRAFT_TARGET_ARCH" in
        amd64) asset_arch=x64 ;;
        arm64) asset_arch=arm64 ;;
        *) echo "Unsupported target architecture: $CRAFT_TARGET_ARCH" >&2; exit 1 ;;
      esac
      asset="atlas-gui-linux-${asset_arch}.tar.gz"
      base="https://github.com/404henryyynotfound/atlas-developers/releases/download/v${version}"
      curl -fsSL "${base}/${asset}" -o "${CRAFT_PART_BUILD}/${asset}"
      curl -fsSL "${base}/${asset}.sha256" -o "${CRAFT_PART_BUILD}/${asset}.sha256"
      (cd "$CRAFT_PART_BUILD" && sha256sum -c "${asset}.sha256")
      mkdir -p "${CRAFT_PART_INSTALL}/opt/atlas-developers"
      tar -xzf "${CRAFT_PART_BUILD}/${asset}" --strip-components=1 \
        -C "${CRAFT_PART_INSTALL}/opt/atlas-developers"
      chmod +x "${CRAFT_PART_INSTALL}/opt/atlas-developers/atlas-developers-gui"

  cli:
    plugin: nil
    build-packages:
      - curl
      - ca-certificates
      - xz-utils
    override-build: |
      set -e
      version="${CRAFT_PROJECT_VERSION:-${SNAPCRAFT_PROJECT_VERSION:-1.0.4}}"
      node_version="v22.14.0"
      case "$CRAFT_TARGET_ARCH" in
        amd64) node_arch=x64 ;;
        arm64) node_arch=arm64 ;;
        *) echo "Unsupported target architecture: $CRAFT_TARGET_ARCH" >&2; exit 1 ;;
      esac
      node_tar="node-${node_version}-linux-${node_arch}.tar.xz"
      curl -fsSL "https://nodejs.org/dist/${node_version}/${node_tar}" \
        -o "${CRAFT_PART_BUILD}/${node_tar}"
      mkdir -p "${CRAFT_PART_INSTALL}/opt"
      tar -xJf "${CRAFT_PART_BUILD}/${node_tar}" -C "${CRAFT_PART_INSTALL}/opt"
      mv "${CRAFT_PART_INSTALL}/opt/node-${node_version}-linux-${node_arch}" \
        "${CRAFT_PART_INSTALL}/opt/node"

      asset="atlas-cli-linux-${node_arch}.tar.gz"
      base="https://github.com/404henryyynotfound/atlas-developers/releases/download/v${version}"
      curl -fsSL "${base}/${asset}" -o "${CRAFT_PART_BUILD}/${asset}"
      curl -fsSL "${base}/${asset}.sha256" -o "${CRAFT_PART_BUILD}/${asset}.sha256"
      (cd "$CRAFT_PART_BUILD" && sha256sum -c "${asset}.sha256")
      mkdir -p "${CRAFT_PART_INSTALL}/opt/atlas-developers"
      tar -xzf "${CRAFT_PART_BUILD}/${asset}" --strip-components=1 \
        -C "${CRAFT_PART_INSTALL}/opt/atlas-developers"

  wrappers:
    plugin: dump
    source: snap/local/wrappers
    organize:
      atlas: bin/atlas
      gui-launch: bin/gui-launch

  desktop-file:
    plugin: dump
    source: snap/local/desktop
    organize:
      atlas-developers.desktop: usr/share/applications/atlas-developers.desktop
      icon.png: meta/gui/icon.png
